# Continuous integration for SokoLink.
#
# Runs on every pull request and every push to main. Per the working agreement,
# a red build does not merge — this workflow is what makes "CI green" in the
# definition of done an enforced rule rather than an intention.
#
# A throwaway Postgres runs as a service container, so database-backed tests
# actually execute here rather than skipping. It is a real Postgres because the
# DB-level constraints ARE the rails — SQLite would silently accept things
# Postgres rejects, which is precisely the class of bug these tests exist to catch.
#
# No real secrets are needed: external services (Apify, Gemini, Meta, Daraja)
# are always mocked, so CI is free to run and safe on forks.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sokolink
          POSTGRES_PASSWORD: sokolink
          POSTGRES_DB: sokolink_test
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails
        # intermittently on a cold runner.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The app URL is never connected to in CI; only its shape is validated.
      DATABASE_URL: postgresql://sokolink:sokolink@localhost:5432/sokolink_app
      # The test URL is real — the suite creates tables and writes rows here.
      TEST_DATABASE_URL: postgresql://sokolink:sokolink@localhost:5432/sokolink_test
      APP_ENV: test
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app tests

      - name: Test (pytest)
        run: pytest -v

      - name: Verify migrations apply to a clean database
        # Proves the migration history is coherent, not just that create_all
        # works. A migration that cannot run from empty is a broken deploy.
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://sokolink:sokolink@localhost:5432/sokolink_test
