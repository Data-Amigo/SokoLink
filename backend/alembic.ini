# Alembic configuration.
#
# NOTE: sqlalchemy.url is deliberately BLANK here. The URL is a secret and this
# file is committed. alembic/env.py reads it from app.config.settings instead,
# so there is exactly one source of the database URL across the app, the tests
# and the migrations. Changing environments never means editing this file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames get a timestamp prefix so they sort chronologically in a
# directory listing — the order they were applied is the order that matters.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
